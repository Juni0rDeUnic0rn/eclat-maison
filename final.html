/* ---------------------------------------------------------------
   STORAGE LAYER — simulates the Supabase tables described in spec
   Shared (true)  => acts like real DB tables everyone reads/writes
   Personal(false)=> acts like the current customer's own rows
---------------------------------------------------------------- */
const HAS_CLOUD_STORAGE = typeof window !== "undefined" && !!window.storage;
const db = {
  async get(key, shared) {
    try {
      if (HAS_CLOUD_STORAGE) {
        const r = await window.storage.get(key, shared);
        return r ? JSON.parse(r.value) : null;
      }
      const raw = window.localStorage.getItem("eclat:" + key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  },
  async set(key, value, shared) {
    try {
      if (HAS_CLOUD_STORAGE) {
        await window.storage.set(key, JSON.stringify(value), shared);
      } else {
        window.localStorage.setItem("eclat:" + key, JSON.stringify(value));
      }
      return true;
    } catch (e) {
      return false;
    }
  },
};

/* ---------------------------------------------------------------
   BRAND / CATALOG DATA
---------------------------------------------------------------- */
const BRANDS = [
  "Éclat Maison", "Noir & Ambre", "Velours Privé", "Sahara Rose",
  "Maison Kessi", "L'Orient Doré", "Ivoire & Oud", "Rêverie Atelier",
  "Ambrose & Co.", "Lumière Noire",
];

const CATEGORIES = [
  { id: "men", label: "Men's Perfumes" },
  { id: "women", label: "Women's Perfumes" },
  { id: "unisex", label: "Unisex Perfumes" },
  { id: "oud", label: "Oud" },
  { id: "arabian", label: "Arabian Fragrances" },
  { id: "luxury", label: "Luxury Fragrances" },
  { id: "body-spray", label: "Body Sprays" },
  { id: "perfume-oil", label: "Perfume Oils" },
  { id: "gift-set", label: "Gift Sets" },
  { id: "discovery-set", label: "Discovery Sets" },
];

const FAMILIES = ["Sweet", "Fresh", "Woody", "Spicy", "Oud", "Floral", "Citrus", "Vanilla", "Musky", "Fruity", "Leather", "Amber"];

const FAMILY_COLOR = {
  Sweet: "#C97B8C", Fresh: "#5E9E8C", Woody: "#7A5C3E", Spicy: "#B4502F",
  Oud: "#4A2E1E", Floral: "#B37FA0", Citrus: "#C9942F", Vanilla: "#D8B26A",
  Musky: "#6C6459", Fruity: "#C0562F", Leather: "#5A3A2A", Amber: "#B0813B",
};

const NOTE_POOL = {
  top: ["bergamot", "pink pepper", "saffron", "mandarin", "cardamom", "green apple", "black currant", "lemon zest", "ginger", "neroli"],
  mid: ["rose", "jasmine", "iris", "geranium", "cinnamon", "orris root", "violet", "lavender", "orange blossom", "clary sage"],
  base: ["oud wood", "sandalwood", "amber", "vanilla", "musk", "tonka bean", "patchouli", "leather", "cedarwood", "vetiver"],
};

function pick(arr, n, seed) {
  const out = [];
  let s = seed;
  for (let i = 0; i < n; i++) {
    s = (s * 9301 + 49297) % 233280;
    out.push(arr[Math.floor((s / 233280) * arr.length)]);
  }
  return [...new Set(out)];
}

function buildCatalog() {
  const adjectives = ["Velvet", "Golden", "Midnight", "Radiant", "Silken", "Wild", "Royal", "Hidden", "Amber", "Crystal", "Noble", "Secret", "Eternal", "Opulent"];
  const nouns = ["Bloom", "Dusk", "Oud", "Mirage", "Reverie", "Veil", "Ember", "Whisper", "Court", "Horizon", "Elixir", "Garden", "Legacy", "Aura"];
  const products = [];
  let id = 1;
  const combos = [
    ["men", "luxury"], ["women", "luxury"], ["unisex", "luxury"], ["men", "oud"], ["women", "oud"],
    ["unisex", "oud", "arabian"], ["men", "arabian"], ["women", "arabian"], ["men"], ["women"],
    ["unisex"], ["unisex", "body-spray"], ["men", "body-spray"], ["women", "perfume-oil"],
    ["unisex", "perfume-oil"], ["men", "gift-set"], ["women", "gift-set"], ["unisex", "discovery-set"],
  ];
  for (let i = 0; i < 46; i++) {
    const seed = i * 37 + 11;
    const brand = BRANDS[i % BRANDS.length];
    const adj = adjectives[(i * 3) % adjectives.length];
    const noun = nouns[(i * 5 + 2) % nouns.length];
    const name = `${adj} ${noun}`;
    const cats = combos[i % combos.length];
    const gender = cats.includes("men") && cats.includes("women") ? "Unisex" : cats.includes("men") ? "Men" : cats.includes("women") ? "Women" : "Unisex";
    const family = FAMILIES[(i * 7 + 3) % FAMILIES.length];
    const basePrice = 180 + ((seed * 13) % 620);
    const onSale = i % 3 === 0;
    const discountPct = onSale ? 10 + ((seed * 5) % 30) : 0;
    const rating = (3.6 + ((seed % 14) / 10)).toFixed(1);
    const reviewCount = 4 + (seed % 90);
    const bestSeller = i % 5 === 0;
    const newArrival = i % 6 === 1;
    products.push({
      id: "p" + id++,
      name, brand, gender,
      categories: cats,
      family,
      color: FAMILY_COLOR[family],
      description: `${name} by ${brand} is a ${family.toLowerCase()}-forward composition built for those who linger in a room after they've left it. Layered over hours, it opens bright and settles into something warmer and more intimate.`,
      topNotes: pick(NOTE_POOL.top, 3, seed),
      midNotes: pick(NOTE_POOL.mid, 3, seed + 1),
      baseNotes: pick(NOTE_POOL.base, 3, seed + 2),
      longevity: ["6-8 hours", "8-10 hours", "10+ hours"][seed % 3],
      projection: ["Intimate", "Moderate", "Strong"][seed % 3],
      sizes: [
        { ml: 30, price: Math.round(basePrice * 0.55) },
        { ml: 50, price: basePrice },
        { ml: 100, price: Math.round(basePrice * 1.7) },
      ],
      discountPct,
      stock: 4 + (seed % 40),
      rating: Number(rating),
      reviewCount,
      bestSeller, newArrival,
      ingredients: "Alcohol denat., parfum (fragrance), aqua, limonene, linalool, citral, coumarin, benzyl benzoate.",
      seller: "Éclat Perfumery Ltd.",
    });
  }
  return products;
}

const DEMO_COUPONS = [
  { code: "WELCOME10", type: "percent", value: 10, active: true, desc: "10% off your first order" },
  { code: "OUD25", type: "flat", value: 25, active: true, desc: "GH₵25 off orders over GH₵400", minSubtotal: 400 },
];

const GH_REGIONS = [
  "Greater Accra", "Ashanti", "Western", "Central", "Eastern", "Volta",
  "Northern", "Bono", "Ahafo", "Western North", "Upper East", "Upper West", "Savannah", "Oti", "Bono East", "North East",
];

/* ---------------------------------------------------------------
   HELPERS
---------------------------------------------------------------- */
const gh = (n) => "GH₵" + Number(n).toLocaleString("en-GH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = (p = "") => p + Math.random().toString(36).slice(2, 10);

function priceFor(product, ml) {
  const s = product.sizes.find((s) => s.ml === ml) || product.sizes[1];
  const price = s.price;
  const discounted = product.discountPct ? Math.round(price * (1 - product.discountPct / 100)) : price;
  return { original: price, final: discounted };
}

   SVG BOTTLE — original artwork placeholder, colored by family

      <path d="M38 34 C38 26 44 24 60 24 C76 24 82 26 82 34 L88 60 C90 64 92 70 92 80 L92 148 C92 153 88 157 83 157 L37 157 C32 157 28 153 28 148 L28 80 C28 70 30 64 32 60 Z" fill={color} opacity="0.92" />
      <path d="M38 34 C38 26 44 24 60 24 C76 24 82 26 82 34 L86 54 L34 54 Z" fill={color} opacity="0.55" />
      <rect x="34" y="92" width="52" height="34" rx="2" fill="#FBF8F2" opacity="0.9" />

/* ---------------------------------------------------------------
   STAR RATING
---------------------------------------------------------------- */
function Stars({ value, size = 14 }) {
  const full = Math.round(value);
  return (
    <span style={{ color: "#B08B4F", fontSize: size, letterSpacing: 1 }} role="img" aria-label={`Rated ${value} out of 5 stars`}>
      <span aria-hidden="true">{"★".repeat(full)}<span style={{ color: "#D8CFBE" }}>{"★".repeat(5 - full)}</span></span>
    </span>
  );
}

/* ---------------------------------------------------------------
   ROOT APP
---------------------------------------------------------------- */
function App() {
  const [ready, setReady] = useState(false);
  const [products, setProducts] = useState([]);
  const [coupons, setCoupons] = useState([]);
  const [reviews, setReviews] = useState({}); // productId -> [review]
  const [orders, setOrders] = useState([]); // all orders (shared, filtered by customer client-side)
  const [profile, setProfile] = useState(null); // {id,name,email,phone,role,addresses:[]}
  const [cart, setCart] = useState([]); // {productId, ml, qty}
  const [wishlist, setWishlist] = useState([]); // productId
  const [view, setView] = useState({ page: "home" });
  const [toast, setToast] = useState(null);
  const [authOpen, setAuthOpen] = useState(false);
  const [cartOpen, setCartOpen] = useState(false);

  const toastRef = useRef();
  function notify(msg) {
    setToast(msg);
    clearTimeout(toastRef.current);
    toastRef.current = setTimeout(() => setToast(null), 2400);
  }

  // ---- initial load / seed ----
  useEffect(() => {
    (async () => {
      let p = await db.get("catalog:products", true);
      if (!p) {
        p = buildCatalog();
        await db.set("catalog:products", p, true);
      }
      let c = await db.get("catalog:coupons", true);
      if (!c) {
        c = DEMO_COUPONS;
        await db.set("catalog:coupons", c, true);
      }
      let r = (await db.get("catalog:reviews", true)) || {};
      let o = (await db.get("catalog:orders", true)) || [];
      let prof = await db.get("customer:profile", false);
      let ct = (await db.get("customer:cart", false)) || [];
      let wl = (await db.get("customer:wishlist", false)) || [];
      setProducts(p);
      setCoupons(c);
      setReviews(r);
      setOrders(o);
      setProfile(prof);
      setCart(ct);
      setWishlist(wl);
      setReady(true);
    })();
  }, []);

  const persistCart = useCallback((next) => { setCart(next); db.set("customer:cart", next, false); }, []);
  const persistWishlist = useCallback((next) => { setWishlist(next); db.set("customer:wishlist", next, false); }, []);
  const persistProfile = useCallback((next) => { setProfile(next); db.set("customer:profile", next, false); }, []);
  const persistProducts = useCallback((next) => { setProducts(next); db.set("catalog:products", next, true); }, []);
  const persistOrders = useCallback((next) => { setOrders(next); db.set("catalog:orders", next, true); }, []);
  const persistReviews = useCallback((next) => { setReviews(next); db.set("catalog:reviews", next, true); }, []);
  const persistCoupons = useCallback((next) => { setCoupons(next); db.set("catalog:coupons", next, true); }, []);

  function go(page, params = {}) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    setView({ page, ...params });
  }

  function addToCart(product, ml, qty = 1) {
    const existing = cart.find((c) => c.productId === product.id && c.ml === ml);
    const stock = product.stock ?? Infinity;
    let next;
    if (existing) {
      const capped = Math.min(existing.qty + qty, stock);
      if (capped <= existing.qty) { notify(`Only ${stock} of ${product.name} in stock — that's already in your bag`); return; }
      next = cart.map((c) => (c === existing ? { ...c, qty: capped } : c));
      if (capped < existing.qty + qty) notify(`Only ${stock} of ${product.name} available — added what's in stock`);
      else notify(`Added ${product.name} (${ml}ml) to cart`);
    } else {
      const capped = Math.min(qty, stock);
      if (capped < 1) { notify(`${product.name} is out of stock`); return; }
      next = [...cart, { productId: product.id, ml, qty: capped }];
      if (capped < qty) notify(`Only ${stock} of ${product.name} available — added what's in stock`);
      else notify(`Added ${product.name} (${ml}ml) to cart`);
    }
    persistCart(next);
  }
  function removeFromCart(productId, ml) {
    persistCart(cart.filter((c) => !(c.productId === productId && c.ml === ml)));
  }
  function updateQty(productId, ml, qty) {
    if (qty < 1) return removeFromCart(productId, ml);
    const product = products.find((p) => p.id === productId);
    const stock = product?.stock ?? Infinity;
    if (qty > stock) { notify(`Only ${stock} in stock`); qty = stock; }
    persistCart(cart.map((c) => (c.productId === productId && c.ml === ml ? { ...c, qty } : c)));
  }
  function toggleWishlist(productId) {
    if (wishlist.includes(productId)) {
      persistWishlist(wishlist.filter((w) => w !== productId));
      notify("Removed from wishlist");
    } else {
      persistWishlist([...wishlist, productId]);
      notify("Added to wishlist");
    }
  }

  const cartLines = useMemo(() => cart.map((c) => {
    const product = products.find((p) => p.id === c.productId);
    if (!product) return null;
    const price = priceFor(product, c.ml);
    return { ...c, product, unitPrice: price.final, originalPrice: price.original };
  }).filter(Boolean), [cart, products]);

  const cartCount = cartLines.reduce((s, l) => s + l.qty, 0);
  const cartSubtotal = cartLines.reduce((s, l) => s + l.unitPrice * l.qty, 0);

  if (!ready) return <ShellLoading />;

  const ctx = {
    products, coupons, reviews, orders, profile, cart, cartLines, cartCount, cartSubtotal,
    wishlist, view, go, notify, addToCart, removeFromCart, updateQty, toggleWishlist,
    setAuthOpen, cartOpen, setCartOpen,
    persistProfile, persistProducts, persistOrders, persistReviews, persistCoupons, persistWishlist,
  };

  return (
    <div style={{ fontFamily: "var(--sans)", background: "var(--cream)", color: "var(--ink)", minHeight: 400 }}>
      <GlobalStyle />
      <Header ctx={ctx} />
      <main>
        {view.page === "home" && <Home ctx={ctx} />}
        {view.page === "category" && <CategoryPage ctx={ctx} />}
        {view.page === "product" && <ProductPage ctx={ctx} />}
        {view.page === "search" && <SearchResults ctx={ctx} />}
        {view.page === "checkout" && <Checkout ctx={ctx} />}
        {view.page === "account" && <Account ctx={ctx} />}
        {view.page === "order" && <OrderDetail ctx={ctx} />}
        {view.page === "admin" && <Admin ctx={ctx} />}
        {view.page === "adminLogin" && <AdminLogin ctx={ctx} />}
      </main>
      <Footer ctx={ctx} />
      {cartOpen && <CartDrawer ctx={ctx} />}
      {authOpen && <AuthModal ctx={ctx} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function ShellLoading() {
  return (
    <div style={{ padding: "4rem", textAlign: "center", fontFamily: "Georgia, serif", color: "#221B15" }}>
      <GlobalStyle />
      Loading Éclat Maison…
    </div>
  );
}

/* ---------------------------------------------------------------
   HEADER
---------------------------------------------------------------- */
function Header({ ctx }) {
  const [q, setQ] = useState("");
  const [suggest, setSuggest] = useState([]);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    document.body.classList.toggle("no-scroll", menuOpen);
    return () => document.body.classList.remove("no-scroll");
  }, [menuOpen]);

  useEffect(() => {
    if (!menuOpen) return;
    function onKey(e) { if (e.key === "Escape") setMenuOpen(false); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [menuOpen]);

  function onSearchChange(v) {
    setQ(v);
    if (v.length < 2) return setSuggest([]);
    const low = v.toLowerCase();
    const matches = ctx.products.filter((p) =>
      p.name.toLowerCase().includes(low) || p.brand.toLowerCase().includes(low) ||
      p.family.toLowerCase().includes(low) || p.categories.some((c) => c.includes(low)) ||
      (low.includes("men") && p.gender === "Men") || (low.includes("long") && p.longevity.includes("10"))
    ).slice(0, 6);
    setSuggest(matches);
  }
  function doSearch(term) {
    setSuggest([]);
    ctx.go("search", { q: term });
  }
  function goAndClose(page, params) {
    setMenuOpen(false);
    ctx.go(page, params);
  }

  return (
    <header>
      <div style={{ background: "var(--ink)", color: "var(--taupe)", fontSize: 12, textAlign: "center", padding: "6px 12px", letterSpacing: 1 }}>
        Free delivery in Greater Accra on orders over GH₵500 · Demo store, no real payment is processed
      </div>
      <div className="container site-header-bar">
        <button
          onClick={() => setMenuOpen(true)}
          className="btn-ghost btn icon-btn hamburger-btn"
          style={{ padding: "8px 12px" }}
          aria-label="Open navigation menu"
          aria-expanded={menuOpen}
          type="button"
        >☰</button>
        <a onClick={() => ctx.go("home")} role="link" tabIndex={0} onKeyDown={(e) => e.key === "Enter" && ctx.go("home")}
          style={{ fontFamily: "var(--serif)", fontSize: 26, letterSpacing: 2, cursor: "pointer", whiteSpace: "nowrap" }}>ÉCLAT MAISON</a>
        <nav className="desktop-nav" aria-label="Primary categories">
          {CATEGORIES.slice(0, 7).map((c) => (
            <a key={c.id} onClick={() => ctx.go("category", { cat: c.id })} style={{ opacity: 0.85 }}>{c.label}</a>
          ))}
        </nav>
        <div className="header-search" role="search">
          <label htmlFor="site-search" className="sr-only">Search fragrances</label>
          <input
            id="site-search"
            value={q}
            onChange={(e) => onSearchChange(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && q.trim() && doSearch(q)}
            placeholder="Search oud, vanilla, men's…"
            aria-label="Search fragrances"
            autoComplete="off"
            style={{ width: "100%", padding: "10px 14px", border: "1px solid var(--line)", background: "#fff", fontSize: 13 }}
          />
          {q.length > 0 && (
            <button type="button" onClick={() => { setQ(""); setSuggest([]); }} aria-label="Clear search"
              style={{ position: "absolute", right: 6, top: 4, background: "none", border: "none", fontSize: 16, color: "#8a8072", padding: 6 }}>×</button>
          )}
          {suggest.length > 0 && (
            <div className="card" role="listbox" style={{ position: "absolute", top: 40, left: 0, right: 0, zIndex: 150, maxHeight: "60vh", overflowY: "auto" }}>
              {suggest.map((p) => (
                <div key={p.id} role="option" tabIndex={0}
                  onClick={() => { ctx.go("product", { id: p.id }); setSuggest([]); setQ(""); }}
                  onKeyDown={(e) => e.key === "Enter" && (ctx.go("product", { id: p.id }), setSuggest([]), setQ(""))}
                  style={{ padding: "10px 12px", fontSize: 13, borderBottom: "1px solid var(--line)", display: "flex", justifyContent: "space-between", gap: 8, cursor: "pointer" }}>
                  <span>{p.name} <span style={{ color: "#8a8072" }}>— {p.brand}</span></span>
                  <span style={{ color: "var(--gold-dark)", whiteSpace: "nowrap" }}>{gh(priceFor(p, 50).final)}</span>
                </div>
              ))}
            </div>
          )}
          {q.length >= 2 && suggest.length === 0 && (
            <div className="card" style={{ position: "absolute", top: 40, left: 0, right: 0, zIndex: 150, padding: "10px 12px", fontSize: 13, color: "#8a8072" }}>
              No matches. Press Enter to search "{q}".
            </div>
          )}
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", fontSize: 20 }}>
          <a onClick={() => ctx.go("account")} title="Account" style={{ fontSize: 13, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: 6, minHeight: 44, justifyContent: "center" }}
            aria-label="Account">
            <span aria-hidden="true">👤</span>
            <span style={{ fontSize: 10, letterSpacing: 0.5 }}>{ctx.profile ? ctx.profile.name.split(" ")[0] : "Account"}</span>
          </a>
          <a onClick={() => ctx.go("account", { tab: "wishlist" })} style={{ position: "relative", fontSize: 13, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: 6, minHeight: 44, justifyContent: "center" }}
            aria-label={`Wishlist${ctx.wishlist.length ? `, ${ctx.wishlist.length} items` : ""}`}>
            <span aria-hidden="true">♡</span>
            <span style={{ fontSize: 10 }}>Wishlist{ctx.wishlist.length ? ` (${ctx.wishlist.length})` : ""}</span>
          </a>
          <button type="button" onClick={() => ctx.setCartOpen(true)} style={{ fontSize: 13, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: 6, minHeight: 44, background: "none", border: "none", color: "inherit" }}
            aria-label={`Open cart${ctx.cartCount ? `, ${ctx.cartCount} items` : ""}`}>
            <span aria-hidden="true">🛍</span>
            <span style={{ fontSize: 10 }}>Cart{ctx.cartCount ? ` (${ctx.cartCount})` : ""}</span>
          </button>
        </div>
      </div>

      {/* mobile nav drawer */}
      <div className={"mobile-drawer-overlay" + (menuOpen ? " open" : "")} onClick={() => setMenuOpen(false)} aria-hidden={!menuOpen} />
      <nav className={"mobile-drawer" + (menuOpen ? " open" : "")} aria-label="Mobile navigation" aria-hidden={!menuOpen}>
        <div className="mobile-drawer-header">
          <span style={{ fontFamily: "var(--serif)", fontSize: 20, letterSpacing: 1 }}>ÉCLAT MAISON</span>
          <button type="button" onClick={() => setMenuOpen(false)} className="icon-btn" aria-label="Close navigation menu" style={{ fontSize: 24 }}>×</button>
        </div>
        <div className="mobile-drawer-body">
          <a onClick={() => goAndClose("home")}>Home</a>
          {CATEGORIES.map((c) => (
            <a key={c.id} onClick={() => goAndClose("category", { cat: c.id })}>{c.label}</a>
          ))}
          <a onClick={() => goAndClose("account")}>{ctx.profile ? "My account" : "Sign in / Register"}</a>
          <a onClick={() => goAndClose("account", { tab: "wishlist" })}>Wishlist{ctx.wishlist.length ? ` (${ctx.wishlist.length})` : ""}</a>
          <a onClick={() => { setMenuOpen(false); ctx.setCartOpen(true); }}>Cart{ctx.cartCount ? ` (${ctx.cartCount})` : ""}</a>
        </div>
      </nav>
    </header>
  );
}

/* ---------------------------------------------------------------
   HOME
---------------------------------------------------------------- */
function Home({ ctx }) {
  const { products } = ctx;
  const bestSellers = products.filter((p) => p.bestSeller).slice(0, 8);
  const newArrivals = products.filter((p) => p.newArrival).slice(0, 8);
  const discounted = products.filter((p) => p.discountPct > 0).slice(0, 8);
  const oud = products.filter((p) => p.categories.includes("oud")).slice(0, 4);
  const luxury = products.filter((p) => p.categories.includes("luxury")).slice(0, 4);
  const affordable = [...products].sort((a, b) => priceFor(a, 30).final - priceFor(b, 30).final).slice(0, 4);
  const men = products.filter((p) => p.gender === "Men").slice(0, 4);
  const women = products.filter((p) => p.gender === "Women").slice(0, 4);
  const unisex = products.filter((p) => p.gender === "Unisex").slice(0, 4);

  return (
    <div>
      <section style={{ background: "linear-gradient(135deg,#221B15,#3A2C1E)", color: "#F7F2E7", padding: "clamp(48px,10vw,90px) 0" }}>
        <div className="container hero-grid">
          <div>
            <p style={{ color: "var(--gold)", fontSize: 13, letterSpacing: 3, marginBottom: 16 }}>THE AUTUMN COLLECTION</p>
            <h1 style={{ fontSize: "clamp(32px,6vw,56px)", lineHeight: 1.08, marginBottom: 20 }}>A scent should<br />arrive before you do.</h1>
            <p style={{ maxWidth: 420, color: "#D8CFBE", fontSize: 16, lineHeight: 1.7, marginBottom: 32, marginLeft: "auto", marginRight: "auto" }}>
              Forty-six fragrances, hand-composed across oud, floral and amber families — sourced for a room that remembers you left it.
            </p>
            <div className="hero-cta-row" style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
              <button className="btn btn-gold" onClick={() => ctx.go("category", { cat: "luxury" })}>Explore the collection</button>
              <button className="btn" style={{ borderColor: "#D8CFBE", color: "#F7F2E7" }} onClick={() => ctx.go("category", { cat: "discovery-set" })}>Shop discovery sets</button>
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "center" }}>
            <div style={{ width: "min(220px, 60vw)" }}><Bottle color="#B08B4F" size={320} /></div>
          </div>
        </div>
      </section>

      <Rail title="Best sellers" items={bestSellers} ctx={ctx} onSeeAll={() => ctx.go("search", { q: "", sort: "bestseller" })} />
      <Rail title="New arrivals" items={newArrivals} ctx={ctx} band />
      <Rail title="On offer" items={discounted} ctx={ctx} />

      <section className="container" style={{ padding: "56px 28px" }}>
        <h2 style={{ fontSize: 28, marginBottom: 28 }}>Shop by world</h2>
        <div className="grid-3">
          <WorldCard label="Men's fragrances" sub="Woody, spiced, grounded" onClick={() => ctx.go("category", { cat: "men" })} color="#3A2C1E" />
          <WorldCard label="Women's fragrances" sub="Floral, sweet, luminous" onClick={() => ctx.go("category", { cat: "women" })} color="#6E1E24" />
          <WorldCard label="Unisex fragrances" sub="Balanced, ambiguous, bold" onClick={() => ctx.go("category", { cat: "unisex" })} color="#4A3F5C" />
        </div>
      </section>

      <Rail title="Oud collection" items={oud} ctx={ctx} onSeeAll={() => ctx.go("category", { cat: "oud" })} />
      <Rail title="Luxury collection" items={luxury} ctx={ctx} band onSeeAll={() => ctx.go("category", { cat: "luxury" })} />
      <Rail title="Affordable fragrances" items={affordable} ctx={ctx} />

      <section style={{ background: "var(--ink)", color: "#F7F2E7", padding: "clamp(48px,8vw,72px) 0" }}>
        <div className="container story-grid">
          <div>
            <p style={{ color: "var(--gold)", fontSize: 13, letterSpacing: 3, marginBottom: 14 }}>OUR STORY</p>
            <h2 style={{ fontSize: 32, marginBottom: 18 }}>Composed in small batches, not mass poured.</h2>
            <p style={{ color: "#D8CFBE", lineHeight: 1.8, maxWidth: 480 }}>
              Éclat Maison began as a single perfumer's bench in Osu, blending oud sourced through
              West African trade routes with European florals. Every bottle is numbered, and every
              formula is rested for six weeks before it's allowed to leave the maison.
            </p>
          </div>
          <div style={{ display: "flex", gap: 16, justifyContent: "center" }}>
            <Bottle color="#6E1E24" size={200} />
            <Bottle color="#B08B4F" size={200} />
          </div>
        </div>
      </section>

      <ReviewsBand ctx={ctx} />
      <Newsletter ctx={ctx} />
    </div>
  );
}

function WorldCard({ label, sub, onClick, color }) {
  return (
    <div onClick={onClick} style={{ background: color, color: "#F7F2E7", padding: "44px 28px", cursor: "pointer", minHeight: 160, display: "flex", flexDirection: "column", justifyContent: "flex-end", transition: "transform .2s" }}
      onMouseEnter={(e) => (e.currentTarget.style.transform = "translateY(-4px)")}
      onMouseLeave={(e) => (e.currentTarget.style.transform = "translateY(0)")}>
      <h3 style={{ fontSize: 22, marginBottom: 6 }}>{label}</h3>
      <p style={{ fontSize: 13, color: "#D8CFBE" }}>{sub}</p>
    </div>
  );
}

function Rail({ title, items, ctx, band, onSeeAll }) {
  if (!items.length) return null;
  return (
    <section style={{ background: band ? "#F0E8D6" : "transparent", padding: "48px 0" }}>
      <div className="container">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 24 }}>
          <h2 style={{ fontSize: 26 }}>{title}</h2>
          {onSeeAll && <a onClick={onSeeAll} style={{ fontSize: 13, letterSpacing: 1, borderBottom: "1px solid var(--ink)" }}>See all</a>}
        </div>
        <div className="grid-4">
          {items.slice(0, 4).map((p) => <ProductCard key={p.id} product={p} ctx={ctx} />)}
        </div>
      </div>
    </section>
  );
}

function ProductCard({ product, ctx }) {
  const price = priceFor(product, 50);
  const inWishlist = ctx.wishlist.includes(product.id);
  const lowStock = product.stock > 0 && product.stock <= 6;
  return (
    <div className="card product-card" style={{ position: "relative", display: "flex", flexDirection: "column", transition: "box-shadow .2s, transform .2s" }}>
      {product.discountPct > 0 && (
        <span style={{ position: "absolute", top: 10, left: 10, background: "var(--wine)", color: "#fff", fontSize: 11, padding: "3px 8px", letterSpacing: 0.5, zIndex: 2 }}>-{product.discountPct}%</span>
      )}
      <button
        onClick={() => ctx.toggleWishlist(product.id)}
        className="icon-btn"
        style={{ position: "absolute", top: 4, right: 4, fontSize: 18, color: inWishlist ? "var(--wine)" : "#B7AC98", zIndex: 2 }}
        aria-label={inWishlist ? `Remove ${product.name} from wishlist` : `Add ${product.name} to wishlist`}
        aria-pressed={inWishlist}
        type="button"
      >{inWishlist ? "♥" : "♡"}</button>
      <button
        onClick={() => ctx.go("product", { id: product.id })}
        style={{ cursor: "pointer", padding: "20px 20px 0", background: "#FBF7EE", border: "none", width: "100%" }}
        aria-label={`View ${product.name} by ${product.brand}`}
      >
        <Bottle color={product.color} size={150} />
      </button>
      <div style={{ padding: 16, flex: 1, display: "flex", flexDirection: "column" }}>
        <p style={{ fontSize: 11, color: "var(--gold-dark)", letterSpacing: 1, marginBottom: 4 }}>{product.brand.toUpperCase()}</p>
        <a onClick={() => ctx.go("product", { id: product.id })} style={{ fontSize: 16, fontFamily: "var(--serif)", marginBottom: 6, display: "block" }}>{product.name}</a>
        <div style={{ marginBottom: 8 }}><Stars value={product.rating} /> <span style={{ fontSize: 11, color: "#8a8072" }}>({product.reviewCount})</span></div>
        <div style={{ marginTop: "auto", display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontWeight: 500 }}>{gh(price.final)}</span>
          {product.discountPct > 0 && <span style={{ fontSize: 12, color: "#A79E8E", textDecoration: "line-through" }}>{gh(price.original)}</span>}
        </div>
        {lowStock && <p style={{ fontSize: 11, color: "var(--wine)", marginTop: 4 }}>Only {product.stock} left</p>}
        {product.stock === 0 && <p style={{ fontSize: 11, color: "#8a8072", marginTop: 4 }}>Out of stock</p>}
        <button className="btn btn-ghost" style={{ marginTop: 10, fontSize: 11, padding: "9px" }} disabled={!product.stock} onClick={() => ctx.addToCart(product, 50, 1)}>{product.stock ? "Add to cart" : "Out of stock"}</button>
      </div>
    </div>
  );
}

function ReviewsBand({ ctx }) {
  const all = Object.entries(ctx.reviews).flatMap(([pid, list]) => list.map((r) => ({ ...r, pid })));
  const sample = all.slice(-3).reverse();
  const fallback = [
    { name: "Ama O.", rating: 5, text: "Longevity is exactly as described — still there after a full workday in Accra heat." },
    { name: "Kwesi A.", rating: 5, text: "The oud is smoky without being heavy. Got three compliments on my first wear." },
    { name: "Efua B.", rating: 4, text: "Beautiful bottle, beautiful scent. Wish 30ml lasted a bit longer but I'll rebuy." },
  ];
  const usingFallback = sample.length === 0;
  const list = usingFallback ? fallback : sample;
  return (
    <section className="container" style={{ padding: "56px 28px" }}>
      <h2 style={{ fontSize: 26, marginBottom: 4 }}>What customers say</h2>
      <p style={{ fontSize: 12, color: "#A79E8E", marginBottom: 24 }}>
        {usingFallback ? "Illustrative placeholder quotes for this demo store — not from real customers yet." : "Recent reviews submitted by demo accounts on this site."}
      </p>
      <div className="grid-3">
        {list.map((r, i) => (
          <div key={i} className="card" style={{ padding: 24 }}>
            <Stars value={r.rating} />
            <p style={{ margin: "12px 0", fontSize: 14, lineHeight: 1.7, color: "#4A4438" }}>"{r.text || r.body}"</p>
            <p style={{ fontSize: 12, color: "#8a8072" }}>— {r.name || r.author || "Verified customer"}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

  const [email, setEmail] = useState("");
  const [done, setDone] = useState(false);
  return (
    <section style={{ background: "#F0E8D6", padding: "56px 0", textAlign: "center" }}>
      <div className="container">
        <h2 style={{ fontSize: 24, marginBottom: 10 }}>Join the maison list</h2>
        <p style={{ color: "#6b6252", marginBottom: 20 }}>New formulas and early access to limited ouds, before they reach the shelves.</p>
        {done ? (
          <p style={{ color: "var(--gold-dark)" }}>Subscribed — welcome in.</p>

          <form onSubmit={(e) => { e.preventDefault(); if (email.includes("@")) { setDone(true); ctx.notify("Subscribed"); } }} style={{ display: "flex", justifyContent: "center", gap: 10 }}>
            <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@email.com" required type="email" style={{ padding: "12px 16px", width: 280, border: "1px solid var(--line)" }} />
            <button className="btn btn-gold" type="submit">Subscribe</button>
          </form>
        )}
      </div>
    </section>
  );
}

        <div>
          <p style={{ fontFamily: "var(--serif)", fontSize: 22, color: "#F7F2E7", marginBottom: 10 }}>ÉCLAT MAISON</p>
          <p style={{ lineHeight: 1.7 }}>Independent perfumery, composed and bottled in Accra.</p>
        </div>
        <div>
          <p style={{ color: "#F7F2E7", marginBottom: 10 }}>Shop</p>
          {CATEGORIES.slice(0, 5).map((c) => <a key={c.id} style={{ display: "block", marginBottom: 6 }} onClick={() => ctx.go("category", { cat: c.id })}>{c.label}</a>)}
        </div>
        <div>

function useFilteredProducts(products, opts) {
  return useMemo(() => {
    let list = [...products];
    if (opts.cat) list = list.filter((p) => p.categories.includes(opts.cat));
    if (opts.q) {
      const low = opts.q.toLowerCase();
      list = list.filter((p) => [p.name, p.brand, p.family, p.gender, ...p.categories].join(" ").toLowerCase().includes(low));
    }
    if (opts.family) list = list.filter((p) => p.family === opts.family);
    if (opts.gender) list = list.filter((p) => p.gender === opts.gender);
    if (opts.brand) list = list.filter((p) => p.brand === opts.brand);
    if (opts.minPrice != null) list = list.filter((p) => priceFor(p, 50).final >= opts.minPrice);
    if (opts.maxPrice != null) list = list.filter((p) => priceFor(p, 50).final <= opts.maxPrice);
    if (opts.minRating) list = list.filter((p) => p.rating >= opts.minRating);
    if (opts.inStock) list = list.filter((p) => p.stock > 0);
    if (opts.sort === "price-asc") list.sort((a, b) => priceFor(a, 50).final - priceFor(b, 50).final);
    else if (opts.sort === "price-desc") list.sort((a, b) => priceFor(b, 50).final - priceFor(a, 50).final);
    else if (opts.sort === "rating") list.sort((a, b) => b.rating - a.rating);
    else if (opts.sort === "bestseller") list.sort((a, b) => (b.bestSeller ? 1 : 0) - (a.bestSeller ? 1 : 0));
    else if (opts.sort === "newest") list.sort((a, b) => (b.newArrival ? 1 : 0) - (a.newArrival ? 1 : 0));
    return list;
  }, [products, JSON.stringify(opts)]);
}

  }, [open]);
  return (
    <>
      {onClose && <div className={"mobile-drawer-overlay" + (open ? " open" : "")} onClick={onClose} style={{ display: open ? "block" : "none" }} />}
      <div className={"filter-panel" + (open ? " open" : "")} role={onClose ? "dialog" : undefined} aria-label={onClose ? "Filter fragrances" : undefined}>

        </div>

function NoteCol({ title, notes }) {

function hasPurchased(ctx, productId) {
  if (!ctx.profile) return false;
  return ctx.orders.some((o) => o.customerId === ctx.profile.id && o.status !== "Cancelled" && o.items.some((it) => it.productId === productId));
}

function ReviewsTab({ ctx, product, reviews, canReview, ratingDist }) {
  const [rating, setRating] = useState(5);
  const [text, setText] = useState("");
  const total = reviews.length || 1;
  const alreadyReviewed = ctx.profile && reviews.some((r) => r.customerId === ctx.profile.id);

  function submit() {
    if (!text.trim()) return ctx.notify("Write a few words first");
    const r = { id: uid("rv"), customerId: ctx.profile.id, name: ctx.profile.name, rating, text, verified: true, date: new Date().toISOString() };
    const next = { ...ctx.reviews, [product.id]: [...(ctx.reviews[product.id] || []), r] };
    ctx.persistReviews(next);
    setText("");
    ctx.notify("Review posted");
  }

  return (
    <div className="reviews-grid">
      <div>
        <p style={{ fontSize: 40, fontFamily: "var(--serif)" }}>{product.rating}<span style={{ fontSize: 16, color: "#8a8072" }}>/5</span></p>
        <Stars value={product.rating} size={18} />
        <p style={{ fontSize: 12, color: "#8a8072", margin: "6px 0 4px" }}>{product.reviewCount} ratings</p>
        <p style={{ fontSize: 11, color: "#A79E8E", marginBottom: 20 }}>Sample rating shown for this demo catalog — not a count of genuine customer ratings.</p>
        {[5, 4, 3, 2, 1].map((star, i) => (
          <div key={star} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <span style={{ fontSize: 11, width: 30 }}>{star}★</span>
            <div style={{ flex: 1, height: 6, background: "#EFE7D6" }}><div style={{ width: `${(ratingDist[i] / total) * 100}%`, height: "100%", background: "var(--gold)" }} /></div>
          </div>
        ))}
      </div>
      <div>
        {canReview && !alreadyReviewed && (
          <div className="card" style={{ padding: 20, marginBottom: 24 }}>
            <p style={{ fontWeight: 500, marginBottom: 10 }}>Write a review — verified purchase</p>
            <div style={{ marginBottom: 10 }} role="radiogroup" aria-label="Rating out of 5 stars">
              {[1, 2, 3, 4, 5].map((n) => (
                <button key={n} type="button" role="radio" aria-checked={rating === n} aria-label={`${n} star${n > 1 ? "s" : ""}`} onClick={() => setRating(n)} className="icon-btn" style={{ fontSize: 20, color: n <= rating ? "var(--gold)" : "#D8CFBE" }}>★</button>
              ))}
            </div>
            <label htmlFor="review-text" className="sr-only">Your review</label>
            <textarea id="review-text" value={text} onChange={(e) => setText(e.target.value)} rows={3} placeholder="How did it wear through the day?" style={{ width: "100%", padding: 10, border: "1px solid var(--line)", marginBottom: 10 }} />
            <button className="btn btn-gold" onClick={submit}>Post review</button>
          </div>
        )}
        {!canReview && ctx.profile && (
          <p style={{ fontSize: 13, color: "#8a8072", marginBottom: 24 }}>Only customers who purchased this fragrance can leave a review.</p>
        )}
        {!ctx.profile && (
          <p style={{ fontSize: 13, color: "#8a8072", marginBottom: 24 }}><a onClick={() => ctx.setAuthOpen(true)} style={{ borderBottom: "1px solid" }}>Sign in</a> to review a fragrance you've purchased.</p>
        )}
        {reviews.length === 0 && <p style={{ color: "#8a8072", fontSize: 14 }}>No reviews yet — be the first.</p>}
        {[...reviews].reverse().map((r) => (
          <div key={r.id} style={{ borderBottom: "1px solid var(--line)", padding: "16px 0" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <b style={{ fontSize: 14 }}>{r.name}</b>
              <span style={{ fontSize: 11, color: "#8a8072" }}>{new Date(r.date).toLocaleDateString()}</span>
            </div>
            <Stars value={r.rating} />
            {r.verified && <span style={{ marginLeft: 8, fontSize: 10, color: "#4C7A5B", border: "1px solid #4C7A5B", padding: "1px 6px" }}>Verified purchase</span>}
            <p style={{ fontSize: 14, marginTop: 8, color: "#4A4438" }}>{r.text}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

    function onKey(e) { if (e.key === "Escape") ctx.setCartOpen(false); }
    window.addEventListener("keydown", onKey);
    return () => { document.body.classList.remove("no-scroll"); window.removeEventListener("keydown", onKey); };
  }, []);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", justifyContent: "flex-end" }} role="dialog" aria-modal="true" aria-label="Shopping bag">
      <div onClick={() => ctx.setCartOpen(false)} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.4)" }} />
      <div className="cart-drawer-panel" style={{ position: "relative", background: "#fff", height: "100%", display: "flex", flexDirection: "column", padding: 24 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <h2 style={{ fontSize: 20 }}>Your bag ({ctx.cartCount})</h2>
          <button onClick={() => ctx.setCartOpen(false)} className="icon-btn" aria-label="Close bag" style={{ fontSize: 22 }} type="button">×</button>
        </div>
        <div style={{ flex: 1, overflowY: "auto" }}>
          {!ctx.cartLines.length && (
            <div style={{ padding: "40px 0", textAlign: "center" }}>
              <p style={{ color: "#8a8072", fontSize: 14, marginBottom: 16 }}>Your bag is empty.</p>
              <button className="btn btn-gold" onClick={() => { ctx.setCartOpen(false); ctx.go("home"); }}>Continue shopping</button>
            </div>
          )}
          {ctx.cartLines.map((l) => (
            <div key={l.productId + l.ml} style={{ display: "flex", gap: 12, marginBottom: 18, borderBottom: "1px solid var(--line)", paddingBottom: 18 }}>
              <div style={{ width: 60, background: "#FBF7EE", flexShrink: 0 }}><Bottle color={l.product.color} size={60} label={l.product.name} /></div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontSize: 14 }}>{l.product.name}</p>
                <p style={{ fontSize: 12, color: "#8a8072", marginBottom: 6 }}>{l.ml}ml</p>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                  <div style={{ display: "flex", border: "1px solid var(--line)" }}>
                    <button onClick={() => ctx.updateQty(l.productId, l.ml, l.qty - 1)} className="icon-btn" aria-label={`Decrease quantity of ${l.product.name}`} style={{ padding: "2px 8px", minWidth: 32, minHeight: 32 }} type="button">−</button>
                    <span style={{ padding: "2px 8px", fontSize: 13 }} aria-live="polite">{l.qty}</span>
                    <button onClick={() => ctx.updateQty(l.productId, l.ml, l.qty + 1)} className="icon-btn" aria-label={`Increase quantity of ${l.product.name}`} disabled={l.qty >= l.product.stock} style={{ padding: "2px 8px", minWidth: 32, minHeight: 32 }} type="button">+</button>
                  </div>
                  <span style={{ fontSize: 13 }}>{gh(l.unitPrice * l.qty)}</span>
                </div>
              </div>
              <button onClick={() => ctx.removeFromCart(l.productId, l.ml)} className="icon-btn" aria-label={`Remove ${l.product.name} from bag`} style={{ color: "#A79E8E" }} type="button">×</button>
            </div>
          ))}
        </div>
        {ctx.cartLines.length > 0 && (
          <div style={{ borderTop: "1px solid var(--line)", paddingTop: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14, fontSize: 15 }}><span>Subtotal</span><b>{gh(ctx.cartSubtotal)}</b></div>
            <button className="btn btn-gold" style={{ width: "100%", padding: 14 }} onClick={() => { ctx.setCartOpen(false); ctx.go("checkout"); }}>Checkout</button>
            <button className="btn btn-ghost" style={{ width: "100%", padding: 12, marginTop: 8 }} onClick={() => { ctx.setCartOpen(false); ctx.go("home"); }}>Continue shopping</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   AUTH MODAL — mock account system
---------------------------------------------------------------- */
function AuthModal({ ctx }) {
  const [mode, setMode] = useState("login");
  const [form, setForm] = useState({ name: "", email: "", phone: "", password: "", confirm: "" });
  const [err, setErr] = useState("");

  useEffect(() => {
    document.body.classList.add("no-scroll");
    function onKey(e) { if (e.key === "Escape") ctx.setAuthOpen(false); }
    window.addEventListener("keydown", onKey);
    return () => { document.body.classList.remove("no-scroll"); window.removeEventListener("keydown", onKey); };
  }, []);

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const PHONE_RE = /^[0-9+\-\s()]{7,}$/;

  function submit(e) {
    e.preventDefault();
    if (mode === "register") {
      if (!form.name || !form.email || !form.phone || !form.password) return setErr("Fill in every field.");
      if (!EMAIL_RE.test(form.email)) return setErr("Enter a valid email address.");
      if (!PHONE_RE.test(form.phone)) return setErr("Enter a valid phone number.");
      if (form.password.length < 6) return setErr("Password must be at least 6 characters.");
      if (form.password !== form.confirm) return setErr("Passwords don't match.");
      const profile = { id: uid("cust"), name: form.name, email: form.email, phone: form.phone, role: "customer", addresses: [] };
      ctx.persistProfile(profile);
      ctx.notify(`Welcome, ${form.name.split(" ")[0]}`);
      ctx.setAuthOpen(false);
    } else {
      if (!form.email || !EMAIL_RE.test(form.email)) return setErr("Enter a valid email address.");
      const name = form.email.split("@")[0].replace(/\./g, " ");
      const profile = { id: uid("cust"), name: name.charAt(0).toUpperCase() + name.slice(1), email: form.email, phone: form.phone || "", role: "customer", addresses: [] };
      ctx.persistProfile(profile);
      ctx.notify("Signed in");
      ctx.setAuthOpen(false);
    }
  }

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} role="dialog" aria-modal="true" aria-label={mode === "login" ? "Sign in" : "Create an account"}>
      <div onClick={() => ctx.setAuthOpen(false)} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.45)" }} />
      <div className="card" style={{ position: "relative", width: 400, maxWidth: "100%", maxHeight: "90vh", overflowY: "auto", padding: 32, background: "#fff" }}>
        <button onClick={() => ctx.setAuthOpen(false)} className="icon-btn" aria-label="Close dialog" type="button" style={{ position: "absolute", top: 10, right: 10, fontSize: 20 }}>×</button>
        <h2 style={{ fontSize: 22, marginBottom: 4 }}>{mode === "login" ? "Sign in" : "Create an account"}</h2>
        <p style={{ fontSize: 12, color: "#8a8072", marginBottom: 20 }}>Demo authentication — no real password is checked.</p>
        <form onSubmit={submit}>
          {mode === "register" && <Field label="Full name" value={form.name} onChange={(v) => setForm({ ...form, name: v })} />}
          <Field label="Email" type="email" value={form.email} onChange={(v) => setForm({ ...form, email: v })} />
          {mode === "register" && <Field label="Phone" value={form.phone} onChange={(v) => setForm({ ...form, phone: v })} />}
          <Field label="Password" type="password" value={form.password} onChange={(v) => setForm({ ...form, password: v })} />
          {mode === "register" && <Field label="Confirm password" type="password" value={form.confirm} onChange={(v) => setForm({ ...form, confirm: v })} />}
          {err && <p style={{ color: "var(--wine)", fontSize: 12, marginBottom: 10 }}>{err}</p>}
          <button className="btn btn-gold" style={{ width: "100%", padding: 12, marginTop: 6 }} type="submit">{mode === "login" ? "Sign in" : "Create account"}</button>
        </form>
        <p style={{ fontSize: 13, marginTop: 16, textAlign: "center", color: "#8a8072" }}>
          {mode === "login" ? "New here?" : "Already have an account?"}{" "}
          <a onClick={() => { setMode(mode === "login" ? "register" : "login"); setErr(""); }} style={{ color: "var(--gold-dark)", borderBottom: "1px solid" }}>{mode === "login" ? "Register" : "Sign in"}</a>
        </p>
      </div>
    </div>
  );
}
let fieldSeq = 0;
function Field({ label, value, onChange, type = "text" }) {
  const idRef = useRef();
  if (!idRef.current) idRef.current = "field-" + (fieldSeq++);
  return (
    <div style={{ marginBottom: 14 }}>
      <label htmlFor={idRef.current} style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>{label}</label>
      <input id={idRef.current} required type={type} value={value} onChange={(e) => onChange(e.target.value)} style={{ width: "100%", padding: 10, border: "1px solid var(--line)" }} />
    </div>
  );
}

/* ---------------------------------------------------------------
   PAYMENT ABSTRACTION — DEMO ONLY
   -----------------------------------------------------------------
   processPayment() is the single place the UI calls to "pay". In this
   demo build it never contacts a real bank, card network, or mobile
   money aggregator — it just waits briefly and returns a simulated
   result. No card/mobile-money credentials are ever transmitted or
   retained; they are discarded the moment this function returns.
   To go live, replace the body of this function with a call to your
   backend (which then talks to a real provider such as Paystack,
   Flutterwave, or a mobile money aggregator). Nothing else in the
   checkout flow needs to change — it only reads {success, reference,
   reason} back from this function.
---------------------------------------------------------------- */
function processPayment({ method, details }) {
  return new Promise((resolve) => {
    setTimeout(() => {
      const digits = (method === "momo" ? details.phone : details.number || "").replace(/\D/g, "");
      const declined = digits.endsWith("0000");
      if (declined) {
        resolve({ success: false, reason: method === "momo" ? "Demo network declined — try a number not ending in 0000." : "Demo test bank declined — try a card not ending in 0000." });
      } else {
        resolve({ success: true, reference: uid("SIM-").toUpperCase() });
      }
    }, 1200);
  });
}

/* ---------------------------------------------------------------
   CHECKOUT — multi-step
---------------------------------------------------------------- */
const STEPS = ["Information", "Delivery", "Payment", "Confirmation"];
const CHECKOUT_EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const CHECKOUT_PHONE_RE = /^[0-9+\-\s()]{7,}$/;
function Checkout({ ctx }) {
  const [step, setStep] = useState(0);
  const [info, setInfo] = useState(() => ({ name: ctx.profile?.name || "", email: ctx.profile?.email || "", phone: ctx.profile?.phone || "" }));
  const [infoErr, setInfoErr] = useState("");
  const [address, setAddress] = useState({ line: "", city: "", region: "Greater Accra" });
  const [deliveryMethod, setDeliveryMethod] = useState("standard");
  const [coupon, setCoupon] = useState("");
  const [couponApplied, setCouponApplied] = useState(null);
  const [couponErr, setCouponErr] = useState("");
  const [paymentMethod, setPaymentMethod] = useState("card");
  const [card, setCard] = useState({ number: "", expiry: "", cvc: "", name: "" });
  const [momo, setMomo] = useState({ network: "MTN", phone: "" });
  const [processing, setProcessing] = useState(false);
  const [order, setOrder] = useState(null);
  const [payErr, setPayErr] = useState("");

  if (!ctx.cartLines.length && !order) {
    return <div className="container" style={{ padding: 80, textAlign: "center" }}>
      <h2 style={{ marginBottom: 12 }}>Your bag is empty</h2>
      <button className="btn btn-gold" onClick={() => ctx.go("home")}>Continue shopping</button>
    </div>;
  }

  const deliveryFee = deliveryMethod === "express" ? 45 : ctx.cartSubtotal >= 500 ? 0 : 25;
  let discount = 0;
  if (couponApplied) {
    const raw = couponApplied.type === "percent" ? Math.round(ctx.cartSubtotal * (couponApplied.value / 100)) : couponApplied.value;
    discount = Math.min(raw, ctx.cartSubtotal); // never discount more than the subtotal itself
  }
  const total = Math.max(0, ctx.cartSubtotal - discount) + deliveryFee;

  function applyCoupon() {
    const c = ctx.coupons.find((c) => c.code.toUpperCase() === coupon.trim().toUpperCase() && c.active);
    if (!c) return setCouponErr("Invalid or expired coupon code.");
    if (c.minSubtotal && ctx.cartSubtotal < c.minSubtotal) return setCouponErr(`Requires a subtotal of ${gh(c.minSubtotal)}.`);
    setCouponApplied(c); setCouponErr("");
  }

  async function placeOrder() {
    if (paymentMethod === "card") {
      if (!card.number || card.number.replace(/\s/g, "").length < 12) return setPayErr("Enter a valid card number.");
      if (!card.expiry || !card.cvc) return setPayErr("Enter card expiry and CVC.");
    } else {
      if (!momo.phone || momo.phone.replace(/\D/g, "").length < 9) return setPayErr("Enter a valid mobile money number.");
    }
    setPayErr("");
    setProcessing(true);

    const result = await processPayment(
      paymentMethod === "card"
        ? { method: "card", details: card }
        : { method: "momo", details: momo }
    );

    // Sensitive payment details are never persisted or kept in memory
    // beyond this point — discard them immediately after the (simulated) call.
    setCard({ number: "", expiry: "", cvc: "", name: "" });
    setMomo({ network: momo.network, phone: "" });

    if (!result.success) {
      setProcessing(false);
      setPayErr(result.reason);
      return;
    }

    const newOrder = {
      id: uid("ORD-").toUpperCase(),
      customerId: ctx.profile?.id || "guest",
      customerName: info.name,
      customerEmail: info.email,
      items: ctx.cartLines.map((l) => ({ productId: l.productId, name: l.product.name, ml: l.ml, qty: l.qty, price: l.unitPrice })),
      subtotal: ctx.cartSubtotal, discount, deliveryFee, total,
      address: { ...address }, deliveryMethod,
      paymentMethod: paymentMethod === "card" ? "Card (demo)" : "Mobile Money (demo)",
      paymentReference: result.reference,
      // Honest label: this store has no real payment gateway connected.
      // No money has actually moved — this only reflects the simulated result above.
      paymentStatus: "Payment Simulated (Demo)",
      status: "Confirmed",
      createdAt: new Date().toISOString(),
      history: [{ status: "Pending", at: new Date().toISOString() }, { status: "Confirmed", at: new Date().toISOString() }],
    };
    // Reduce demo stock so inventory reflects the simulated purchase
    ctx.persistProducts(ctx.products.map((p) => {
      const line = ctx.cartLines.find((l) => l.productId === p.id);
      return line ? { ...p, stock: Math.max(0, p.stock - line.qty) } : p;
    }));
    ctx.persistOrders([newOrder, ...ctx.orders]);
    db.set("customer:cart", [], false);
    setOrder(newOrder);
    setProcessing(false);
    setStep(3);
  }

  return (
    <div className="container" style={{ padding: "40px 28px", maxWidth: 1000 }}>
      <div style={{ display: "flex", gap: 0, marginBottom: 36 }} role="list" aria-label="Checkout steps">
        {STEPS.map((s, i) => (
          <div key={s} role="listitem" aria-current={i === step ? "step" : undefined} style={{ flex: 1, textAlign: "center", borderBottom: i <= step ? "2px solid var(--gold)" : "2px solid var(--line)", paddingBottom: 10, fontSize: 12, letterSpacing: 1, color: i <= step ? "var(--ink)" : "#A79E8E" }}>
            <span className="sr-only">Step </span>{i + 1}<span className="sr-only">: {s}</span>
            <span style={{ display: "inline" }}> {s}</span>
          </div>
        ))}
      </div>

      {step === 0 && (
        <div style={{ maxWidth: 460 }}>
          <h2 style={{ fontSize: 22, marginBottom: 18 }}>Customer information</h2>
          <Field label="Full name" value={info.name} onChange={(v) => setInfo({ ...info, name: v })} />
          <Field label="Email" type="email" value={info.email} onChange={(v) => setInfo({ ...info, email: v })} />
          <Field label="Phone" value={info.phone} onChange={(v) => setInfo({ ...info, phone: v })} />
          {infoErr && <p style={{ color: "var(--wine)", fontSize: 12, marginBottom: 10 }}>{infoErr}</p>}
          <button className="btn btn-gold" style={{ marginTop: 8 }} disabled={!info.name || !info.email || !info.phone} onClick={() => {
            if (!CHECKOUT_EMAIL_RE.test(info.email)) return setInfoErr("Enter a valid email address.");
            if (!CHECKOUT_PHONE_RE.test(info.phone)) return setInfoErr("Enter a valid phone number.");
            setInfoErr("");
            setStep(1);
          }}>Continue to delivery</button>
        </div>
      )}

      {step === 1 && (
        <div style={{ maxWidth: 460 }}>
          <h2 style={{ fontSize: 22, marginBottom: 18 }}>Delivery address</h2>
          <Field label="Street address" value={address.line} onChange={(v) => setAddress({ ...address, line: v })} />
          <Field label="City / town" value={address.city} onChange={(v) => setAddress({ ...address, city: v })} />
          <div style={{ marginBottom: 14 }}>
            <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Region</label>
            <select value={address.region} onChange={(e) => setAddress({ ...address, region: e.target.value })} style={{ width: "100%", padding: 10, border: "1px solid var(--line)" }}>
              {GH_REGIONS.map((r) => <option key={r}>{r}</option>)}
            </select>
          </div>
          <p style={{ fontSize: 12, color: "#8a8072", marginBottom: 10 }}>Delivery method</p>
          {[["standard", "Standard (3-5 days)", ctx.cartSubtotal >= 500 ? 0 : 25], ["express", "Express (1-2 days)", 45]].map(([id, label, fee]) => (
            <label key={id} style={{ display: "flex", justifyContent: "space-between", padding: 12, border: "1px solid var(--line)", marginBottom: 8, cursor: "pointer", background: deliveryMethod === id ? "#F0E8D6" : "transparent" }}>
              <span><input type="radio" name="dm" checked={deliveryMethod === id} onChange={() => setDeliveryMethod(id)} style={{ marginRight: 8 }} />{label}</span>
              <span>{fee === 0 ? "Free" : gh(fee)}</span>
            </label>
          ))}
          <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
            <button className="btn btn-ghost" onClick={() => setStep(0)}>Back</button>
            <button className="btn btn-gold" disabled={!address.line || !address.city} onClick={() => setStep(2)}>Continue to payment</button>
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="checkout-grid">
          <div>
            <h2 style={{ fontSize: 22, marginBottom: 10 }}>Payment</h2>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#F0E8D6", color: "var(--gold-dark)", fontSize: 11, letterSpacing: 0.5, padding: "4px 10px", marginBottom: 14 }}>
              <span aria-hidden="true">●</span> DEMO MODE — no real payment gateway is connected
            </div>
            <p style={{ fontSize: 12, color: "#8a8072", marginBottom: 18 }}>
              This checkout only simulates a payment result so you can test the full order flow. No card or mobile money details are transmitted to a bank, network, or stored after this step — enter any test values below. A number ending in <b>0000</b> simulates a decline.
            </p>

            <p id="pm-label" style={{ fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: "#8a8072", marginBottom: 10 }}>Payment method</p>
            <div role="radiogroup" aria-labelledby="pm-label" style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap" }}>
              {[["card", "Card"], ["momo", "Mobile Money"]].map(([id, label]) => (
                <button key={id} type="button" role="radio" aria-checked={paymentMethod === id} onClick={() => { setPaymentMethod(id); setPayErr(""); }} className="btn" style={{ padding: "10px 16px", fontSize: 12, background: paymentMethod === id ? "var(--ink)" : "transparent", color: paymentMethod === id ? "#fff" : "var(--ink)" }}>{label}</button>
              ))}
            </div>

            {paymentMethod === "card" ? (
              <>
                <Field label="Name on card" value={card.name} onChange={(v) => setCard({ ...card, name: v })} />
                <Field label="Card number (demo — any digits)" value={card.number} onChange={(v) => setCard({ ...card, number: v })} />
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <div style={{ flex: "1 1 140px" }}><Field label="Expiry (MM/YY)" value={card.expiry} onChange={(v) => setCard({ ...card, expiry: v })} /></div>
                  <div style={{ flex: "1 1 100px" }}><Field label="CVC" value={card.cvc} onChange={(v) => setCard({ ...card, cvc: v })} /></div>
                </div>
              </>
            ) : (
              <>
                <div style={{ marginBottom: 14 }}>
                  <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Network</label>
                  <select value={momo.network} onChange={(e) => setMomo({ ...momo, network: e.target.value })} style={{ width: "100%", padding: 10, border: "1px solid var(--line)" }}>
                    {["MTN", "Vodafone Cash", "AirtelTigo Money"].map((n) => <option key={n}>{n}</option>)}
                  </select>
                </div>
                <Field label="Mobile money number (demo — any digits)" value={momo.phone} onChange={(v) => setMomo({ ...momo, phone: v })} />
              </>
            )}

            {payErr && <p style={{ color: "var(--wine)", fontSize: 13, marginBottom: 10 }} role="alert">{payErr}</p>}
            <div style={{ display: "flex", gap: 10, marginTop: 8, flexWrap: "wrap" }}>
              <button className="btn btn-ghost" onClick={() => setStep(1)} disabled={processing} type="button">Back</button>
              <button className="btn btn-gold" onClick={placeOrder} disabled={processing} type="button">{processing ? "Simulating payment…" : `Simulate payment of ${gh(total)}`}</button>
            </div>
          </div>
          <OrderSummary ctx={ctx} coupon={coupon} setCoupon={setCoupon} applyCoupon={applyCoupon} couponApplied={couponApplied} couponErr={couponErr} discount={discount} deliveryFee={deliveryFee} total={total} />
        </div>
      )}

      {step === 3 && order && (
        <div style={{ textAlign: "center", padding: "20px 0 60px" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✓</div>
          <h2 style={{ fontSize: 26, marginBottom: 10 }}>Order placed</h2>
          <p style={{ color: "#8a8072", marginBottom: 6 }}>Order {order.id} · {gh(order.total)}</p>
          <p style={{ color: "#8a8072", marginBottom: 6, fontSize: 13 }}>Your order details are saved to your account and order tracking below.</p>
          <p style={{ color: "#A79E8E", marginBottom: 28, fontSize: 12 }}>Demo store: payment was simulated, not actually charged, and no confirmation email was sent.</p>
          <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
            <button className="btn btn-ghost" onClick={() => ctx.go("home")}>Continue shopping</button>
            <button className="btn btn-gold" onClick={() => ctx.go("order", { id: order.id })}>Track order</button>
          </div>
        </div>
      )}
    </div>
  );
}

function OrderSummary({ ctx, coupon, setCoupon, applyCoupon, couponApplied, couponErr, discount, deliveryFee, total }) {
  return (
    <div className="card" style={{ padding: 20, height: "fit-content" }}>
      <p style={{ fontWeight: 500, marginBottom: 14 }}>Order summary</p>
      {ctx.cartLines.map((l) => (
        <div key={l.productId + l.ml} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 8 }}>
          <span>{l.product.name} ({l.ml}ml) × {l.qty}</span><span>{gh(l.unitPrice * l.qty)}</span>
        </div>
      ))}
      <div style={{ display: "flex", gap: 8, margin: "14px 0" }}>
        <input value={coupon} onChange={(e) => setCoupon(e.target.value)} placeholder="Coupon code" style={{ flex: 1, padding: 8, border: "1px solid var(--line)", fontSize: 12 }} />
        <button className="btn btn-ghost" style={{ padding: "8px 12px", fontSize: 12 }} onClick={applyCoupon}>Apply</button>
      </div>
      {couponErr && <p style={{ color: "var(--wine)", fontSize: 12, marginBottom: 8 }}>{couponErr}</p>}
      {couponApplied && <p style={{ color: "#4C7A5B", fontSize: 12, marginBottom: 8 }}>Applied {couponApplied.code}</p>}
      <div style={{ borderTop: "1px solid var(--line)", paddingTop: 12, fontSize: 13 }}>
        <Row a="Subtotal" b={gh(ctx.cartSubtotal)} />
        {discount > 0 && <Row a="Discount" b={"-" + gh(discount)} />}
        <Row a="Delivery" b={deliveryFee === 0 ? "Free" : gh(deliveryFee)} />
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, fontSize: 16 }}><b>Total</b><b>{gh(total)}</b></div>
      </div>
    </div>
  );
}
function Row({ a, b }) { return <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><span>{a}</span><span>{b}</span></div>; }

function WishlistTab({ ctx, products }) {

function AddressesTab({ ctx }) {

---------------------------------------------------------------- */
const STATUS_FLOW = ["Pending", "Confirmed", "Processing", "Shipped", "Out for Delivery", "Delivered"];
function OrderDetail({ ctx }) {
  const order = ctx.orders.find((o) => o.id === ctx.view.id);
  if (!order) return <div className="container" style={{ padding: 60 }}>Order not found.</div>;
  const cancelled = order.status === "Cancelled";
  const currentIdx = STATUS_FLOW.indexOf(order.status);
  return (
    <div className="container" style={{ padding: "40px 28px", maxWidth: 800 }}>
      <h1 style={{ fontSize: 26, marginBottom: 6 }}>Order {order.id}</h1>
      <p style={{ fontSize: 13, color: "#8a8072", marginBottom: 30 }}>Placed {new Date(order.createdAt).toLocaleString()}</p>

      {!cancelled ? (
        <div style={{ display: "flex", marginBottom: 40 }}>
          {STATUS_FLOW.map((s, i) => (
            <div key={s} style={{ flex: 1, textAlign: "center" }}>
              <div style={{ width: 24, height: 24, borderRadius: "50%", margin: "0 auto 8px", background: i <= currentIdx ? "var(--gold)" : "#E4DBC8" }} />
              <p style={{ fontSize: 11, color: i <= currentIdx ? "var(--ink)" : "#A79E8E" }}>{s}</p>
              {i < STATUS_FLOW.length - 1 && <div style={{ height: 2, background: i < currentIdx ? "var(--gold)" : "#E4DBC8", marginTop: -32, marginLeft: "50%" }} />}
            </div>
          ))}
        </div>
      ) : (
        <div style={{ marginBottom: 30 }}><StatusBadge status="Cancelled" /></div>
      )}

      <div className="card" style={{ padding: 20, marginBottom: 20 }}>
        {order.items.map((it, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 8 }}>
            <span>{it.name} ({it.ml}ml) × {it.qty}</span><span>{gh(it.price * it.qty)}</span>
          </div>
        ))}
        <div style={{ borderTop: "1px solid var(--line)", marginTop: 10, paddingTop: 10, display: "flex", justifyContent: "space-between", fontWeight: 500 }}>
          <span>Total</span><span>{gh(order.total)}</span>
        </div>
      </div>
      <div className="card order-detail-grid" style={{ padding: 20, fontSize: 13 }}>
        <div><p style={{ color: "#8a8072", marginBottom: 4 }}>Delivery address</p><p>{order.address.line}, {order.address.city}, {order.address.region}</p></div>
        <div><p style={{ color: "#8a8072", marginBottom: 4 }}>Payment</p><p>{order.paymentStatus}{order.paymentMethod ? ` · ${order.paymentMethod}` : ""} · {order.deliveryMethod === "express" ? "Express delivery" : "Standard delivery"}</p></div>
      </div>
    </div>
  );
}

function AdminOverview({ ctx }) {
  const revenue = ctx.orders.filter((o) => o.status !== "Cancelled").reduce((s, o) => s + o.total, 0);
  const productsSold = ctx.orders.reduce((s, o) => s + o.items.reduce((a, it) => a + it.qty, 0), 0);
  const customers = new Set(ctx.orders.map((o) => o.customerId)).size;
  const sold = {};
  ctx.orders.forEach((o) => o.items.forEach((it) => { sold[it.name] = (sold[it.name] || 0) + it.qty; }));
  const bestSelling = Object.entries(sold).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return (
    <div>
      <h2 style={{ fontSize: 24, marginBottom: 24 }}>Overview</h2>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16, marginBottom: 32 }}>
        <Metric label="Revenue" value={gh(revenue)} />
        <Metric label="Orders" value={ctx.orders.length} />
        <Metric label="Customers" value={customers} />
        <Metric label="Products sold" value={productsSold} />
      </div>
      <p style={{ fontWeight: 500, marginBottom: 12 }}>Best-selling fragrances</p>
      {bestSelling.length === 0 && <p style={{ color: "#8a8072", fontSize: 13 }}>No sales yet.</p>}
      {bestSelling.map(([name, qty]) => (
        <div key={name} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--line)", fontSize: 14 }}><span>{name}</span><span>{qty} sold</span></div>
      ))}
