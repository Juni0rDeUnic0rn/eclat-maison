}
function Metric({ label, value }) {
  return <div className="card" style={{ padding: 18 }}><p style={{ fontSize: 12, color: "#8a8072", marginBottom: 6 }}>{label}</p><p style={{ fontSize: 24, fontFamily: "var(--serif)" }}>{value}</p></div>;
}

function AdminProducts({ ctx }) {
  const [editing, setEditing] = useState(null);
  const [query, setQuery] = useState("");
  const list = ctx.products.filter((p) => p.name.toLowerCase().includes(query.toLowerCase()));

  function save(p) {
    const exists = ctx.products.some((x) => x.id === p.id);
    const next = exists ? ctx.products.map((x) => (x.id === p.id ? p : x)) : [...ctx.products, p];
    ctx.persistProducts(next);
    setEditing(null);
    ctx.notify(exists ? "Product updated" : "Product added");
  }
  function del(id) { ctx.persistProducts(ctx.products.filter((p) => p.id !== id)); ctx.notify("Product deleted"); }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 20 }}>
        <h2 style={{ fontSize: 24 }}>Products ({ctx.products.length})</h2>
        <button className="btn btn-gold" onClick={() => setEditing({ id: uid("p"), name: "", brand: BRANDS[0], gender: "Unisex", categories: ["unisex"], family: "Woody", color: "#7A5C3E", description: "", topNotes: [], midNotes: [], baseNotes: [], longevity: "8-10 hours", projection: "Moderate", sizes: [{ ml: 30, price: 150 }, { ml: 50, price: 260 }, { ml: 100, price: 420 }], discountPct: 0, stock: 20, rating: 4.5, reviewCount: 0, bestSeller: false, newArrival: true, ingredients: "", seller: "Éclat Perfumery Ltd." })}>Add perfume</button>
      </div>
      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search products…" style={{ padding: 10, border: "1px solid var(--line)", width: 280, marginBottom: 16 }} />
      <div style={{ display: "grid", gap: 8 }}>
        {list.map((p) => (
          <div key={p.id} className="card" style={{ padding: 12, display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ width: 40 }}><Bottle color={p.color} size={40} /></div>
            <div style={{ flex: 1 }}>
              <p style={{ fontSize: 14 }}>{p.name} <span style={{ color: "#8a8072", fontSize: 12 }}>— {p.brand}</span></p>
              <p style={{ fontSize: 12, color: "#8a8072" }}>{gh(priceFor(p, 50).final)} · stock {p.stock} · {p.categories.join(", ")}</p>
            </div>
            <button className="btn btn-ghost" style={{ padding: "6px 12px", fontSize: 12 }} onClick={() => setEditing(p)}>Edit</button>
            <button onClick={() => del(p.id)} style={{ background: "none", border: "none", color: "var(--wine)" }}>Delete</button>
          </div>
        ))}
      </div>
      {editing && <ProductEditor product={editing} onSave={save} onClose={() => setEditing(null)} />}
    </div>
  );
}

function ProductEditor({ product, onSave, onClose }) {
  const [p, setP] = useState(product);
  function upd(field, val) { setP({ ...p, [field]: val }); }
  function updSize(i, val) { const sizes = [...p.sizes]; sizes[i] = { ...sizes[i], price: Number(val) }; setP({ ...p, sizes }); }
  function toggleCat(id) { const c = p.categories.includes(id) ? p.categories.filter((x) => x !== id) : [...p.categories, id]; setP({ ...p, categories: c }); }
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.45)" }} />
      <div className="card" style={{ position: "relative", width: 560, maxWidth: "94vw", maxHeight: "88vh", overflowY: "auto", padding: 28, background: "#fff" }}>
        <h2 style={{ fontSize: 20, marginBottom: 18 }}>{product.name ? "Edit perfume" : "Add perfume"}</h2>
        <Field label="Name" value={p.name} onChange={(v) => upd("name", v)} />
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Brand</label>
            <select value={p.brand} onChange={(e) => upd("brand", e.target.value)} style={{ width: "100%", padding: 10, border: "1px solid var(--line)", marginBottom: 14 }}>
              {BRANDS.map((b) => <option key={b}>{b}</option>)}
            </select>
          </div>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Gender</label>
            <select value={p.gender} onChange={(e) => upd("gender", e.target.value)} style={{ width: "100%", padding: 10, border: "1px solid var(--line)", marginBottom: 14 }}>
              {["Men", "Women", "Unisex"].map((g) => <option key={g}>{g}</option>)}
            </select>
          </div>
        </div>
        <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Categories</label>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14 }}>
          {CATEGORIES.map((c) => (
            <button key={c.id} type="button" onClick={() => toggleCat(c.id)} className="btn" style={{ padding: "6px 10px", fontSize: 11, background: p.categories.includes(c.id) ? "var(--ink)" : "transparent", color: p.categories.includes(c.id) ? "#fff" : "var(--ink)" }}>{c.label}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Fragrance family</label>
            <select value={p.family} onChange={(e) => setP({ ...p, family: e.target.value, color: FAMILY_COLOR[e.target.value] })} style={{ width: "100%", padding: 10, border: "1px solid var(--line)", marginBottom: 14 }}>
              {FAMILIES.map((f) => <option key={f}>{f}</option>)}
            </select>
          </div>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Stock</label>
            <input type="number" value={p.stock} onChange={(e) => upd("stock", Number(e.target.value))} style={{ width: "100%", padding: 10, border: "1px solid var(--line)", marginBottom: 14 }} />
          </div>
        </div>
        <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Prices by size (GH₵)</label>
        <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
          {p.sizes.map((s, i) => (
            <div key={s.ml} style={{ flex: 1 }}>
              <p style={{ fontSize: 11, color: "#8a8072", marginBottom: 4 }}>{s.ml}ml</p>
              <input type="number" value={s.price} onChange={(e) => updSize(i, e.target.value)} style={{ width: "100%", padding: 8, border: "1px solid var(--line)" }} />
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}><Field label="Discount %" value={p.discountPct} onChange={(v) => upd("discountPct", Number(v) || 0)} /></div>
        </div>
        <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Description</label>
        <textarea value={p.description} onChange={(e) => upd("description", e.target.value)} rows={3} style={{ width: "100%", padding: 10, border: "1px solid var(--line)", marginBottom: 16 }} />
        <div style={{ display: "flex", gap: 10 }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-gold" onClick={() => { if (!p.name) return; onSave(p); }}>Save perfume</button>
        </div>
      </div>
    </div>
  );
}

function AdminOrders({ ctx }) {
  function setStatus(orderId, status) {
    const order = ctx.orders.find((o) => o.id === orderId);
    const next = ctx.orders.map((o) => o.id === orderId ? { ...o, status, history: [...o.history, { status, at: new Date().toISOString() }] } : o);
    ctx.persistOrders(next);
    if (status === "Cancelled" && order && order.status !== "Cancelled") {
      // Return simulated stock since a decrement happened at purchase time
      ctx.persistProducts(ctx.products.map((p) => {
        const line = order.items.find((it) => it.productId === p.id);
        return line ? { ...p, stock: p.stock + line.qty } : p;
      }));
    }
    ctx.notify(`Order marked ${status}`);
  }
  return (
    <div>
      <h2 style={{ fontSize: 24, marginBottom: 20 }}>Orders ({ctx.orders.length})</h2>
      {!ctx.orders.length && <p style={{ color: "#8a8072" }}>No orders placed yet.</p>}
      {ctx.orders.map((o) => (
        <div key={o.id} className="card" style={{ padding: 16, marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <p style={{ fontWeight: 500 }}>{o.id} — {o.customerName}</p>
              <p style={{ fontSize: 12, color: "#8a8072" }}>{o.items.length} item(s) · {gh(o.total)} · {new Date(o.createdAt).toLocaleDateString()}</p>
            </div>
            <select value={o.status} onChange={(e) => setStatus(o.id, e.target.value)} style={{ padding: 8, border: "1px solid var(--line)" }}>
              {[...STATUS_FLOW, "Cancelled"].map((s) => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminCoupons({ ctx }) {
  const [form, setForm] = useState({ code: "", type: "percent", value: 10 });
  function add() {
    if (!form.code) return;
    ctx.persistCoupons([...ctx.coupons, { ...form, code: form.code.toUpperCase(), active: true }]);
    setForm({ code: "", type: "percent", value: 10 });
  }
  function toggle(code) { ctx.persistCoupons(ctx.coupons.map((c) => c.code === code ? { ...c, active: !c.active } : c)); }
  function del(code) { ctx.persistCoupons(ctx.coupons.filter((c) => c.code !== code)); }
  return (
    <div>
      <h2 style={{ fontSize: 24, marginBottom: 20 }}>Coupons & promotions</h2>
      {ctx.coupons.map((c) => (
        <div key={c.code} className="card" style={{ padding: 14, marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <p style={{ fontWeight: 500 }}>{c.code}</p>
            <p style={{ fontSize: 12, color: "#8a8072" }}>{c.type === "percent" ? `${c.value}% off` : `${gh(c.value)} off`}{c.minSubtotal ? ` · min ${gh(c.minSubtotal)}` : ""}</p>
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <span style={{ fontSize: 12, color: c.active ? "#4C7A5B" : "#A79E8E" }}>{c.active ? "Active" : "Disabled"}</span>
            <button className="btn btn-ghost" style={{ padding: "6px 10px", fontSize: 12 }} onClick={() => toggle(c.code)}>{c.active ? "Disable" : "Enable"}</button>
            <button onClick={() => del(c.code)} style={{ background: "none", border: "none", color: "var(--wine)" }}>Delete</button>
          </div>
        </div>
      ))}
      <div className="card" style={{ padding: 16, marginTop: 20, maxWidth: 400 }}>
        <p style={{ fontWeight: 500, marginBottom: 12 }}>Create a coupon</p>
        <Field label="Code" value={form.code} onChange={(v) => setForm({ ...form, code: v })} />
        <div style={{ display: "flex", gap: 12 }}>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 12, color: "#8a8072", display: "block", marginBottom: 5 }}>Type</label>
            <select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} style={{ width: "100%", padding: 10, border: "1px solid var(--line)", marginBottom: 14 }}>
              <option value="percent">Percent off</option>
              <option value="flat">Flat GH₵ off</option>
            </select>
          </div>
          <div style={{ flex: 1 }}><Field label="Value" value={form.value} onChange={(v) => setForm({ ...form, value: Number(v) })} /></div>
        </div>
        <button className="btn btn-gold" onClick={add}>Create coupon</button>
      </div>
    </div>
  );
}

function AdminReviews({ ctx }) {
  const all = [];
  Object.entries(ctx.reviews).forEach(([pid, list]) => list.forEach((r) => all.push({ ...r, pid })));
  function del(pid, id) {
    const next = { ...ctx.reviews, [pid]: ctx.reviews[pid].filter((r) => r.id !== id) };
    ctx.persistReviews(next);
  }
  return (
    <div>
      <h2 style={{ fontSize: 24, marginBottom: 20 }}>Reviews ({all.length})</h2>
      {!all.length && <p style={{ color: "#8a8072" }}>No customer reviews yet.</p>}
      {all.map((r) => {
        const p = ctx.products.find((p) => p.id === r.pid);
        return (
          <div key={r.id} className="card" style={{ padding: 14, marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <p style={{ fontSize: 13, fontWeight: 500 }}>{p?.name} <span style={{ color: "#8a8072", fontWeight: 400 }}>— {r.name}</span></p>
              <Stars value={r.rating} />
              <p style={{ fontSize: 13, marginTop: 6 }}>{r.text}</p>
            </div>
            <button onClick={() => del(r.pid, r.id)} style={{ background: "none", border: "none", color: "var(--wine)" }}>Remove</button>
          </div>
        );
      })}
    </div>
  );
}


ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
